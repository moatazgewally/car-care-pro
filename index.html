<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Car Care Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; direction: rtl; text-align: right; }
    .app-container { max-width: 460px; margin: 0 auto; min-height: 100vh; padding-bottom: 85px; position: relative; }
    .card { background: #ffffff; border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; }
    
    /* 🤲 تنسيق كارت الرسالة الطيبة والصدقة الجارية */
    .sadaqa-card {
      background: linear-gradient(135deg, #fffdf5, #fff7d6);
      border: 1px solid #f3d98b;
      border-radius: 18px;
      padding: 18px 16px;
      margin: 16px 0;
      text-align: center;
      box-shadow: 0 5px 15px rgba(180, 130, 20, 0.08);
    }
    .sadaqa-icon { font-size: 30px; margin-bottom: 8px; }
    .sadaqa-title { color: #8a6412; font-size: 15px; font-weight: 900; margin-bottom: 10px; }
    .sadaqa-message {
      color: #5f4b1c;
      font-size: 13px;
      line-height: 1.9;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    .sadaqa-btn {
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      color: #ffffff;
      background: #b8860b;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sadaqa-btn:active { transform: scale(0.97); }

    /* Footer أسفل التطبيق */
    .app-footer {
      text-align: center;
      color: #64748b;
      font-size: 11px;
      line-height: 1.8;
      padding: 18px 12px 80px;
      font-weight: 600;
    }

    .btn { display: block; width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
    .btn:disabled { background: #94a3b8 !important; cursor: not-allowed; }
    .btn-green { background: #10b981; }
    .btn-purple { background: #8b5cf6; }
    .btn-red { background: #ef4444; }
    .btn-subtle { background: #eff6ff; color: #2563eb; width: auto; padding: 6px 12px; font-size: 12px; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #475569; }
    .input-field { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: bold; outline: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .header { background: #ffffff; padding: 12px 16px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 30; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { background: #0f172a; color: #fff; font-size: 10px; padding: 3px 7px; border-radius: 6px; font-weight: bold; }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 460px; margin: 0 auto; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; justify-space-around; padding: 8px 4px; z-index: 40; }
    .nav-item { flex: 1; border: none; background: transparent; padding: 8px 2px; font-size: 11px; font-weight: bold; color: #64748b; cursor: pointer; text-align: center; border-radius: 10px; }
    .nav-item.active { background: #2563eb; color: #ffffff; }
    .hidden { display: none !important; }
    .stat-box { background: #fef3c7; border: 1px solid #fde68a; padding: 12px; border-radius: 14px; text-align: center; }
    .stat-box-green { background: #d1fae5; border: 1px solid #a7f3d0; }
    
    #toastContainer { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 100; width: 92%; max-width: 420px; }
    .toast { padding: 12px 16px; border-radius: 14px; background: #1e293b; color: #fff; font-size: 13px; margin-bottom: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); border-right: 5px solid #2563eb; }
    .toast.success { border-right-color: #10b981; }
    .toast.error { border-right-color: #ef4444; }
    .toast.warning { border-right-color: #f59e0b; }
    .toast-title { font-weight: 800; font-size: 13px; margin-bottom: 2px; display: block; }
    .toast-quote { font-size: 12px; color: #cbd5e1; font-style: italic; font-weight: 600; }
    
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(15,23,42,0.6); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-card { background: #fff; border-radius: 20px; width: 100%; max-width: 400px; padding: 20px; }
    @media print { .nav-bar, .header, .btn, #toastContainer, .no-print, .sadaqa-card, .app-footer { display: none !important; } .app-container { max-width: 100%; } }
  </style>
</head>
<body>

<div id="toastContainer"></div>

<div class="app-container">

  <!-- صفحة الدخول والتسجيل -->
  <div id="authSection" style="padding: 24px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 64px; height: 64px; background: #2563eb; color: #fff; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 32px;">🚗</div>
      <h1 style="font-size: 24px; font-weight: 900;">Car Care Pro</h1>
      <p style="font-size: 12px; color: #64748b; font-weight: bold;">لوحة تحليلات آمنة للنقل الذكي والصيانة</p>
    </div>

    <div id="loginCard" class="card">
      <h2 style="font-size: 15px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px;">تسجيل الدخول</h2>
      <div class="input-group">
        <label>اسم المستخدم</label>
        <input type="text" id="loginUser" class="input-field" placeholder="ادخل اسم المستخدم">
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="loginPass" class="input-field" placeholder="••••••••">
      </div>
      <button type="button" class="btn" id="btnLogin" onclick="doLogin()">دخول التطبيق</button>
      <div style="text-align: center; margin-top: 14px;">
        <button type="button" style="background:none; border:none; color:#8b5cf6; font-size:12px; font-weight:bold; cursor:pointer;" onclick="toggleAuthView('register')">ليس لديك حساب؟ إنشاء حساب جديد</button>
      </div>
    </div>

    <div id="registerCard" class="card hidden">
      <h2 style="font-size: 15px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px;">حساب جديد</h2>
      <div class="input-group">
        <label>اسم مستخدم جديد</label>
        <input type="text" id="regUser" class="input-field" placeholder="اسم المستخدم">
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="regPass" class="input-field" placeholder="كلمة المرور">
      </div>
      <button type="button" class="btn btn-purple" id="btnRegister" onclick="doRegister()">إنشاء الحساب وتأمين البيانات</button>
      <div style="text-align: center; margin-top: 14px;">
        <button type="button" style="background:none; border:none; color:#2563eb; font-size:12px; font-weight:bold; cursor:pointer;" onclick="toggleAuthView('login')">لديك حساب بالفعل؟ تسجيل الدخول</button>
      </div>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="appSection" class="hidden">
    <div class="header">
      <div class="header-top">
        <div>
          <span class="badge">DRIVER</span>
          <span id="userLabel" style="font-size: 12px; font-weight: bold; margin-right: 6px;">-</span>
        </div>
        <div>
          <button type="button" class="btn btn-green" style="display:inline-block; width:auto; padding:5px 12px; font-size:11px;" onclick="loadUserCars()">تحديث</button>
          <button type="button" class="btn btn-red" style="display:inline-block; width:auto; padding:5px 12px; font-size:11px;" onclick="doLogout()">خروج</button>
        </div>
      </div>
      <select id="carSelect" onchange="switchCar(this.value)" class="input-field" style="padding: 8px; font-size: 12px;"></select>
    </div>

    <div id="tabContent" style="padding: 16px;"></div>

    <div class="nav-bar">
      <button type="button" class="nav-item active" id="btn-home" onclick="navTo('home')">الرئيسية</button>
      <button type="button" class="nav-item" id="btn-daily" onclick="navTo('daily')">الوردية</button>
      <button type="button" class="nav-item" id="btn-routine" onclick="navTo('routine')">الروتين</button>
      <button type="button" class="nav-item" id="btn-history" onclick="navTo('history')">التقارير</button>
      <button type="button" class="nav-item" id="btn-cars" onclick="navTo('cars')">السيارات</button>
    </div>
  </div>

</div>

<div id="shiftModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:10px; margin-bottom:12px;">
      <h3 style="font-size:15px; font-weight:900;">📋 تفاصيل الوردية</h3>
      <button onclick="closeModal()" style="background:none; border:none; font-size:18px; cursor:pointer;">✕</button>
    </div>
    <div id="modalBody" style="font-size:13px;"></div>
    <button class="btn" style="margin-top:16px; background:#475569;" onclick="closeModal()">إغلاق</button>
  </div>
</div>

<script>
  // 🔗 رابط Apps Script الخاص بك
  const API_URL = "https://script.google.com/macros/s/AKfycbyl041pAIsE3k6N-rBrtx_l6e0IUn_lAtbAasj20r4k-qX5oFpS_1A08X6U_KjV4vDk/exec";

  // قائمة الرسائل والدعوات الطيبة
  const sadaqaMessages = [
    "لو البرنامج نفعك، ادعُ لصاحبه: اللهم اجعل هذا العمل صدقة جارية في ميزان حسناته.",
    "اللهم بارك لمن ساهم في هذا البرنامج، وانفع به كل من استخدمه.",
    "دعوة لصاحب البرنامج من قلبك، ربنا يرزقه ويبارك له في وقته وعمله.",
    "اللهم اجعل كل شخص استفاد من هذا البرنامج سببًا في زيادة أجر من عمله.",
    "ربنا يجعل العمل ده نافعًا، ويجعل أثره ممتدًا حتى بعد صاحبه.",
    "اللهم اغفر لمن ساهم في هذا العمل، وبارك له في رزقه وأهله وصحته.",
    "دعوة لأخوك من قلبك، يمكن تكون سبب فرج لا يعلمه إلا الله.",
    "اللهم ارزقك رزقًا حلالًا واسعًا، وبارك لك في سيارتك وشغلك.",
    "ربنا يبارك لك في تعبك، ويجعل كل جنيه حلال سبب راحة وخير.",
    "اللهم احفظك من الحوادث والأعطال، وردك لأهلك سالمًا غانمًا.",
    "ربنا يوسع رزقك، ويقضي دينك، ويبارك لك في صحتك ووقتك.",
    "اللهم اجعل يومك رزقًا وبركة وسترًا وراحة بال.",
    "اللهم اشفِ كل مريض، واقضِ دين كل مديون، وفرّج هم كل مهموم.",
    "اللهم ارحم موتانا وموتى المسلمين، واغفر لهم ونوّر قبورهم.",
    "اللهم صل وسلم وبارك على سيدنا محمد.",
    "سبحان الله وبحمده، سبحان الله العظيم.",
    "لا تنسَ والديك من دعوة طيبة.",
    "ربنا يفرّح قلبك، ويعوّضك عن كل تعب شوفته.",
    "اللهم اجعلنا سببًا في الخير، ولا تجعلنا سببًا في أذى أحد.",
    "ربنا يرزقك من حيث لا تحتسب، ويبعد عنك شر الطريق والميكانيكي."
  ];

  function showRandomSadaqaMessage() {
    var messageElement = document.getElementById("sadaqaMessage");
    if (!messageElement) return;
    var randomIndex = Math.floor(Math.random() * sadaqaMessages.length);
    messageElement.textContent = sadaqaMessages[randomIndex];
  }

  const shiftMessages = [
    "ما شاء الله، الوردية داخلة برجليها. ربنا يبارك.",
    "ربنا يرزقك من الحلال، ويحمي العربية من الميكانيكي.",
    "الله ينور، العربية أكلت عيش النهارده.",
    "الحمد لله، لقمة عيش محترمة وربنا يزيدها.",
    "ربنا يعوض، شكل الوردية كانت بتتفرج على الشوارع.",
    "العربية اشتغلت النهارده بنظام العمل التطوعي.",
    "المكسب موجود، وافتكر صاحبه بدعوة طيبة.",
    "ربنا يجعل تعبك كله في ميزان حسناتك."
  ];

  function getRandomShiftMessage() {
    var index = Math.floor(Math.random() * shiftMessages.length);
    return shiftMessages[index];
  }

  async function apiCall(data, params = "") {
    if (data) {
      let res = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
      return await res.json();
    } else {
      let res = await fetch(API_URL + params);
      return await res.json();
    }
  }

  function showToast(title, type = 'info', quote = '') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    let html = `<span class="toast-title">${title}</span>`;
    if (quote) html += `<div class="toast-quote">"${quote}"</div>`;
    toast.innerHTML = html;
    container.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 4000);
  }

  let session = { userId: null, username: null };
  let appState = { cars: [], activeCarId: null, rules: [], shifts: [] };
  let currentTab = 'home';

  window.onload = function() {
    let saved = localStorage.getItem('carCare_session');
    if (saved) {
      try {
        session = JSON.parse(saved);
        if (session.userId && session.username) startApp(true);
      } catch(e) { localStorage.removeItem('carCare_session'); }
    }
  };

  function toggleAuthView(view) {
    if (view === 'register') {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('registerCard').classList.remove('hidden');
    } else {
      document.getElementById('registerCard').classList.add('hidden');
      document.getElementById('loginCard').classList.remove('hidden');
    }
  }

  async function doLogin() {
    let u = document.getElementById('loginUser').value.trim();
    let p = document.getElementById('loginPass').value.trim();
    if (!u || !p) return showToast('يرجى إدخال البيانات كاملة', 'error');

    let btn = document.getElementById('btnLogin');
    btn.innerText = 'جاري التحقق...';
    btn.disabled = true;

    try {
      let res = await apiCall({ action: "login", username: u, password: p });
      btn.innerText = 'دخول التطبيق';
      btn.disabled = false;
      if (res.success) {
        session = res.data;
        localStorage.setItem('carCare_session', JSON.stringify(session));
        startApp();
      } else showToast(res.message, 'error');
    } catch(err) {
      btn.innerText = 'دخول التطبيق';
      btn.disabled = false;
      showToast('خطأ في الاتصال بالخادم', 'error');
    }
  }

  async function doRegister() {
    let u = document.getElementById('regUser').value.trim();
    let p = document.getElementById('regPass').value.trim();
    if (!u || !p) return showToast('يرجى ملء كافة البيانات', 'error');

    let btn = document.getElementById('btnRegister');
    btn.innerText = 'جاري الحفظ...';
    btn.disabled = true;

    try {
      let res = await apiCall({ action: "register", username: u, password: p });
      btn.innerText = 'إنشاء الحساب وتأمين البيانات';
      btn.disabled = false;
      if (res.success) {
        session = res.data;
        localStorage.setItem('carCare_session', JSON.stringify(session));
        startApp();
      } else showToast(res.message, 'error');
    } catch(err) {
      btn.innerText = 'إنشاء الحساب وتأمين البيانات';
      btn.disabled = false;
      showToast('خطأ في الاتصال بالخادم', 'error');
    }
  }

  function doLogout() {
    localStorage.removeItem('carCare_session');
    location.reload();
  }

  function startApp(isAuto = false) {
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('appSection').classList.remove('hidden');
    document.getElementById('userLabel').textContent = session.username;
    
    navTo('home');

    setTimeout(function() {
      showRandomSadaqaMessage();
    }, 300);

    if (!isAuto) showToast('تم تسجيل الدخول بنجاح ✅', 'success', 'توكلنا على الله، ربنا يجعلها فاتحة خير عليك.');
    loadUserCars();
  }

  async function loadUserCars() {
    let res = await apiCall(null, `?action=getCars&userId=${session.userId}`);
    if (res.success) {
      appState.cars = res.data;
      if (appState.cars.length > 0 && !appState.activeCarId) {
        appState.activeCarId = appState.cars[0].id;
      }
      renderCarSelect();
      loadCarRulesAndShifts();
    }
  }

  async function loadCarRulesAndShifts() {
    let car = getActiveCar();
    if (!car) { renderTab(); return; }

    let rRes = await apiCall(null, `?action=getRules&carId=${car.id}`);
    if (rRes.success) appState.rules = rRes.data;

    let sRes = await apiCall(null, `?action=getShifts&userId=${session.userId}&carId=${car.id}`);
    if (sRes.success) appState.shifts = sRes.data;

    renderTab();
  }

  function renderCarSelect() {
    let sel = document.getElementById('carSelect');
    sel.innerHTML = '';
    if (appState.cars.length === 0) {
      sel.innerHTML = '<option value="">لا توجد سيارات مسجلة</option>';
      return;
    }
    appState.cars.forEach(c => {
      sel.innerHTML += `<option value="${c.id}" ${String(c.id) === String(appState.activeCarId) ? 'selected' : ''}>🚘 ${c.name}</option>`;
    });
  }

  function switchCar(id) {
    appState.activeCarId = id;
    loadCarRulesAndShifts();
  }

  function navTo(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    let btn = document.getElementById(`btn-${tab}`);
    if (btn) btn.classList.add('active');
    renderTab();
  }

  function getActiveCar() {
    return appState.cars.find(c => String(c.id) === String(appState.activeCarId));
  }

  function renderTab() {
    let car = getActiveCar();
    let container = document.getElementById('tabContent');

    if (!car && currentTab !== 'cars') {
      container.innerHTML = `<div class="card" style="text-align:center; padding:30px;">
        <p style="font-size:13px; color:#64748b; font-weight:bold; margin-bottom:12px;">مفيش عربيات لسه، نبدأ نضيف أول واحدة؟ 🚗</p>
        <button class="btn" onclick="navTo('cars')">+ إضافة سيارة الآن</button>
      </div>`;
      return;
    }

    if (currentTab === 'home') {
      let rulesHtml = appState.rules.map(r => {
        let rem = (r.lastDoneKm + r.intervalKm) - car.odometer;
        let statusColor = rem <= 500 ? '#dc2626' : (rem <= 1000 ? '#d97706' : '#10b981');
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; font-size:12px; border-bottom:1px dashed #f1f5f9;">
            <div><b>${r.name}</b><small style="color:#94a3b8; display:block;">كل ${r.intervalKm} كم</small></div>
            <div style="font-weight:900; color:${statusColor};">باقي ${rem} كم</div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <!-- كارت الرسالة الطيبة -->
        <div class="sadaqa-card">
          <div class="sadaqa-icon">🤲</div>
          <div class="sadaqa-title">رسالة طيبة لعلها تنفع</div>
          <div id="sadaqaMessage" class="sadaqa-message">
            اللهم اجعل هذا العمل صدقة جارية في ميزان حسنات من ساهم فيه.
          </div>
          <button type="button" class="sadaqa-btn" onclick="showRandomSadaqaMessage()">دعوة جديدة 🔄</button>
        </div>

        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <span style="font-size:11px; color:#64748b; font-weight:bold;">عداد السيارة الحالي</span>
            <div style="font-size:24px; font-weight:900;">${(car.odometer||0).toLocaleString('ar-EG')} <small style="font-size:12px; color:#2563eb;">كم</small></div>
            <small style="font-size:10px; color:#94a3b8;">آخر تحديث: ${car.lastUpdate}</small>
          </div>
          <button class="btn btn-subtle" onclick="updateKmPrompt()">تحديث العداد</button>
        </div>

        <div class="card">
          <h3 style="font-size:13px; font-weight:bold; margin-bottom:10px;">روتين الصيانة الحالي</h3>
          ${rulesHtml || '<div style="font-size:11px; color:#94a3b8;">لا توجد بنود صيانة</div>'}
        </div>

        <!-- Footer أسفل التطبيق -->
        <div class="app-footer">
          <div>🤲 اللهم اجعل هذا العمل صدقة جارية</div>
          <div>لو انتفعت بالبرنامج، ادعُ لصاحبه ولو بدعوة واحدة</div>
        </div>
      `;
      setTimeout(showRandomSadaqaMessage, 50);
    }
    else if (currentTab === 'daily') {
      let recent10Shifts = appState.shifts.slice().reverse().slice(0, 10);
      container.innerHTML = `
        <div class="card">
          <h3 style="font-size:14px; font-weight:bold; margin-bottom:12px;">📝 تسجيل وردية اليوم</h3>
          <div class="input-group"><label>إجمالي إيراد اليوم (ج.م):</label><input type="number" id="shiftRev" class="input-field"></div>
          <div class="grid-2">
            <div class="input-group"><label>مشوار اليوم (كم):</label><input type="number" id="shiftKm" class="input-field"></div>
            <div class="input-group"><label>بنزين اليوم (ج.م):</label><input type="number" id="shiftFuel" class="input-field"></div>
          </div>
          <div class="input-group"><label>نثريات / ركنة (ج.م):</label><input type="number" id="shiftMisc" class="input-field"></div>
          <button class="btn btn-green" id="btnSaveShift" onclick="saveShiftAction()">حساب وصفي الوردية</button>
        </div>

        <div id="resBox" class="card hidden">
          <div class="grid-2">
            <div class="stat-box"><span style="font-size:11px; font-weight:bold;">🏦 شيل في الحصالة</span><div id="outSaving" style="font-size:18px; font-weight:900;">0 ج.م</div></div>
            <div class="stat-box stat-box-green"><span style="font-size:11px; font-weight:bold;">💵 الصافي الحقيقي</span><div id="outNet" style="font-size:18px; font-weight:900;">0 ج.م</div></div>
          </div>
        </div>

        <div class="card">
          <h3 style="font-size:13px; font-weight:bold; margin-bottom:10px;">📊 أحدث الورديات (آخر 10 ورديات)</h3>
          ${recent10Shifts.map(s => renderShiftCard(s)).join('') || '<div style="font-size:11px; color:#94a3b8;">لا توجد ورديات</div>'}
        </div>
      `;
    }
    else if (currentTab === 'history') {
      container.innerHTML = `
        <div class="card no-print">
          <h3 style="font-size:14px; font-weight:bold; margin-bottom:12px;">📅 الفلترة بالتاريخ</h3>
          <div class="grid-2">
            <div class="input-group"><label>من:</label><input type="date" id="filterFrom" class="input-field"></div>
            <div class="input-group"><label>إلى:</label><input type="date" id="filterTo" class="input-field"></div>
          </div>
          <div class="grid-2" style="margin-top:5px;">
            <button class="btn" onclick="applyDateFilter()">تطبيق الفلتر</button>
            <button class="btn btn-purple" onclick="window.print()">طباعة / PDF</button>
          </div>
        </div>

        <div class="card">
          <h3 style="font-size:14px; font-weight:bold; margin-bottom:10px;">📋 سجل الورديات التفصيلي</h3>
          <div id="historyList">${renderHistoryList(appState.shifts.slice().reverse())}</div>
        </div>
      `;
    }
    else if (currentTab === 'routine') {
      container.innerHTML = `
        <div class="card">
          <h3 style="font-size:14px; font-weight:bold; margin-bottom:12px;">🛠️ إضافة بند صيانة</h3>
          <div class="input-group"><label>اسم البند</label><input type="text" id="ruleName" class="input-field"></div>
          <div class="grid-2">
            <div class="input-group"><label>كل كم كم؟</label><input type="number" id="ruleInterval" class="input-field"></div>
            <div class="input-group"><label>التكلفة التقديرية</label><input type="number" id="ruleCost" class="input-field"></div>
          </div>
          <button class="btn btn-purple" id="btnAddRule" onclick="addRuleAction()">حفظ البند</button>
        </div>
      `;
    }
    else if (currentTab === 'cars') {
      container.innerHTML = `
        <div class="card">
          <h3 style="font-size:14px; font-weight:bold; margin-bottom:12px;">+ إضافة سيارة</h3>
          <div class="input-group"><label>اسم السيارة</label><input type="text" id="newCarName" class="input-field"></div>
          <div class="input-group"><label>العداد الحالي</label><input type="number" id="newCarKm" class="input-field"></div>
          <div class="grid-2">
            <div class="input-group"><label>القسط الشهري</label><input type="number" id="newCarInst" value="1500" class="input-field"></div>
            <div class="input-group"><label>أيام العمل/شهر</label><input type="number" id="newCarDays" value="20" class="input-field"></div>
          </div>
          <button class="btn" id="btnAddCar" onclick="addCarAction()">حفظ السيارة</button>
        </div>
      `;
    }
  }

  function renderShiftCard(s) {
    return `
      <div onclick="openShiftModal('${s.id}')" style="background:#f8fafc; padding:12px; border-radius:14px; margin-bottom:10px; border:1px solid #e2e8f0; cursor:pointer;">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span style="font-size:12px; font-weight:800;">📅 ${s.date}</span>
          <span style="font-size:13px; font-weight:900; color:#059669;">صافي: ${s.net} ج.م</span>
        </div>
        <div class="grid-2" style="font-size:11px; color:#475569;">
          <div>إيراد: <b>${s.revenue}</b> ج.م</div>
          <div>🏦 حصالة: <b>${s.saving}</b> ج.م</div>
        </div>
      </div>
    `;
  }

  function renderHistoryList(list) {
    if (list.length === 0) return '<div style="font-size:11px; color:#94a3b8; text-align:center;">لا توجد ورديات مسجلة</div>';
    return list.map(s => renderShiftCard(s)).join('');
  }

  function applyDateFilter() {
    let from = document.getElementById('filterFrom').value;
    let to = document.getElementById('filterTo').value;
    if (!from || !to) return showToast('يرجى تحديد التاريخ', 'warning');

    let filtered = appState.shifts.filter(s => s.isoDate >= from && s.isoDate <= to);
    document.getElementById('historyList').innerHTML = renderHistoryList(filtered.slice().reverse());
  }

  function openShiftModal(shiftId) {
    let shift = appState.shifts.find(s => String(s.id) === String(shiftId));
    if (!shift) return;

    let html = `
      <div style="display:flex; flex-direction:column; gap:8px; font-weight:bold;">
        <div>📅 التاريخ: ${shift.date}</div>
        <div>إجمالي الإيراد: <b style="color:#2563eb;">${shift.revenue} ج.م</b></div>
        <div>مشوار اليوم: <b>${shift.km} كم</b></div>
        <div>بنزين اليوم: <b style="color:#ef4444;">${shift.fuel} ج.م</b></div>
        <div>نثريات وركنة: <b>${shift.misc} ج.م</b></div>
        <hr>
        <div>📌 قسط اليوم: <b>${shift.installment} ج.م</b></div>
        <div>🛠️ صيانة المشوار: <b>${shift.maint} ج.م</b></div>
        <div style="background:#fef3c7; padding:6px; border-radius:6px;">🏦 إجمالي الحصالة: <b>${shift.saving} ج.م</b></div>
        <div style="background:#d1fae5; padding:8px; border-radius:8px; font-size:14px; color:#047857;">💵 الصافي الحقيقي: <b>${shift.net} ج.م</b></div>
      </div>
    `;

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('shiftModal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('shiftModal').classList.add('hidden');
  }

  async function updateKmPrompt() {
    let car = getActiveCar();
    let val = prompt('أدخل قيمة العداد الجديدة (كم):', car.odometer);
    if (val !== null && !isNaN(val)) {
      let res = await apiCall({ action: "updateKm", userId: session.userId, carId: car.id, newKm: val });
      if (res.success) { showToast(res.message, 'success'); loadUserCars(); }
    }
  }

  async function addCarAction() {
    let name = document.getElementById('newCarName').value;
    let km = document.getElementById('newCarKm').value;
    let inst = document.getElementById('newCarInst').value;
    let days = document.getElementById('newCarDays').value;

    let res = await apiCall({ action: "addCar", userId: session.userId, carName: name, odometer: km, installment: inst, workDays: days });
    if (res.success) { showToast(res.message, 'success'); loadUserCars(); }
  }

  async function addRuleAction() {
    let car = getActiveCar();
    let name = document.getElementById('ruleName').value;
    let interval = document.getElementById('ruleInterval').value;
    let cost = document.getElementById('ruleCost').value;

    let res = await apiCall({ action: "addRule", carId: car.id, name: name, intervalKm: interval, estCost: cost, currentKm: car.odometer });
    if (res.success) { showToast(res.message, 'success'); loadCarRulesAndShifts(); }
  }

  async function saveShiftAction() {
    let car = getActiveCar();
    let rev = document.getElementById('shiftRev').value;
    let km = document.getElementById('shiftKm').value;
    let fuel = document.getElementById('shiftFuel').value;
    let misc = document.getElementById('shiftMisc').value;

    let res = await apiCall({ action: "saveShift", userId: session.userId, carId: car.id, km: km, revenue: rev, fuel: fuel, misc: misc });
    if (res.success) {
      document.getElementById('resBox').classList.remove('hidden');
      document.getElementById('outSaving').innerText = res.data.savingTarget + ' ج.م';
      document.getElementById('outNet').innerText = res.data.netProfit + ' ج.م';
      
      let randomShiftQuote = getRandomShiftMessage();
      showToast(`تم حفظ الوردية بنجاح ✅`, "success", randomShiftQuote);
      loadUserCars();
    }
  }
</script>
</body>
</html>
